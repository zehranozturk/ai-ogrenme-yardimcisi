<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yapay Zeka Kavram Açıklayıcı</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #d2f1f6, #e7c5e8);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 2.5rem;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #5e188c;
            margin-bottom: 2rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        input[type="text"], select {
            padding: 1rem;
            font-size: 1rem;
            border: 2px solid #c084fc;
            border-radius: 10px;
        }
        button {
            padding: 1rem;
            font-size: 1rem;
            background-color: #7c3aed;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #5b21b6;
        }
        .result {
            margin-top: 2rem;
            background-color: #f3e8ff;
            border-left: 5px solid #7c3aed;
            padding: 1.5rem;
            border-radius: 10px;
        }
        .result h3 {
            color: #6b21a8;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Yapay Zeka Kavram Açıklayıcı</h1>
        <form method="post" action="/explain">
            <input type="text" name="term" placeholder="Bir yapay zeka kavramı girin (örneğin: attention)" value="{{ term if term else '' }}" required>

            <select name="language">
                <option value="en" {% if language == "en" %}selected{% endif %}>İngilizce</option>
                <option value="tr" {% if language == "tr" %}selected{% endif %}>Türkçe</option>
            </select>

            <button type="submit">Açıkla</button>
        </form>

        {% if explanation %}
        <div class="result">
            <h3><strong>{{ term|capitalize }}</strong> kavramının açıklaması:</h3>
            <p>{{ explanation }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
