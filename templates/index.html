<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yapay Zeka Kavram Açıklayıcı</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #e0f7fa, #e1bee7);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 3rem;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #4a148c;
            margin-bottom: 1.5rem;
        }
        form {
            display: flex;
            gap: 1rem;
            flex-direction: column;
        }
        input[type="text"] {
            padding: 1rem;
            font-size: 1rem;
            border: 2px solid #ce93d8;
            border-radius: 8px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #8e24aa;
        }
        button {
            padding: 1rem;
            font-size: 1rem;
            background-color: #8e24aa;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #6a1b9a;
        }
        .result {
            margin-top: 2rem;
            background: #f3e5f5;
            padding: 1.5rem;
            border-radius: 10px;
            border: 1px solid #d1c4e9;
        }
        .result h3 {
            margin-top: 0;
            color: #6a1b9a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Yapay Zeka Kavram Açıklayıcı</h1>
        <form method="post" action="/explain">
            <input type="text" name="term" placeholder="Bir yapay zeka kavramı girin (örneğin: attention)" required>
            <button type="submit">Açıkla</button>
        </form>

        {% if explanation %}
        <div class="result">
            <h3>Açıklama:</h3>
            <p>{{ explanation }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
